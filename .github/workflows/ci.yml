name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Lint
        run: gofmt -w $(find . -name '*.go' -not -path './vendor/*') && git diff --exit-code

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
