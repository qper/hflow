{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default "postgres://postgres:postgres@postgres:5432/habitflow?sslmode=disable" | quote }}
  access-secret: {{ .Values.secrets.accessSecret | default "dev-access-secret" | quote }}
  refresh-secret: {{ .Values.secrets.refreshSecret | default "dev-refresh-secret" | quote }}
  vapid-public-key: {{ .Values.secrets.vapidPublicKey | default "" | quote }}
  vapid-private-key: {{ .Values.secrets.vapidPrivateKey | default "" | quote }}
{{- end }}
